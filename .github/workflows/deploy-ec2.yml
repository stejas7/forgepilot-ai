name: Deploy ForgePilot to EC2

on:
  workflow_run:
    workflows: ["ForgePilot CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: forgepilot-production
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
    steps:
      - name: Resolve tested commit
        id: release
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check deployment configuration
        id: config
        run: |
          if [ -z "$EC2_HOST" ] || [ -z "$EC2_USERNAME" ] || [ -z "$EC2_SSH_KEY" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "## EC2 deployment not configured" >> "$GITHUB_STEP_SUMMARY"
            echo "Add repository secrets EC2_HOST, EC2_USERNAME and EC2_SSH_KEY. CI remains green; no deployment was attempted." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare SSH key
        if: steps.config.outputs.ready == 'true'
        run: |
          printf '%s\n' "$EC2_SSH_KEY" > "$RUNNER_TEMP/ec2_key"
          chmod 600 "$RUNNER_TEMP/ec2_key"

      - name: EC2 preflight
        if: steps.config.outputs.ready == 'true'
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=no -i "$RUNNER_TEMP/ec2_key" "$EC2_USERNAME@$EC2_HOST" 'docker --version && docker compose version && df -h /'

      - name: Deploy immutable image
        if: steps.config.outputs.ready == 'true'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -Eeuo pipefail
          SSH="ssh -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=no -i $RUNNER_TEMP/ec2_key $EC2_USERNAME@$EC2_HOST"
          printf '%s' "$GHCR_TOKEN" | $SSH "sudo docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
          $SSH "set -Eeuo pipefail; mkdir -p ~/forgepilot-ai; cd ~/forgepilot-ai; if [ ! -d .git ]; then git clone https://github.com/${{ github.repository }}.git .; fi; git fetch --prune origin main; git reset --hard '$RELEASE_SHA'; export FORGEPILOT_IMAGE='ghcr.io/${{ github.repository }}:$RELEASE_SHA'; sudo -E docker compose pull; sudo -E docker compose up -d --remove-orphans"

      - name: Verify EC2 health
        if: steps.config.outputs.ready == 'true'
        run: |
          set -Eeuo pipefail
          SSH="ssh -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=no -i $RUNNER_TEMP/ec2_key $EC2_USERNAME@$EC2_HOST"
          $SSH 'for i in $(seq 1 40); do body=$(curl --connect-timeout 2 --max-time 5 -fsS http://127.0.0.1:8080/actuator/health || true); echo "$body"; echo "$body" | grep -q '"'"'"status"'"'":"'"'"UP"'"'"' && exit 0; sleep 3; done; docker logs --tail=200 forgepilot-ai || true; exit 1'

      - name: Verify platform contract
        if: steps.config.outputs.ready == 'true'
        run: |
          SSH="ssh -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=no -i $RUNNER_TEMP/ec2_key $EC2_USERNAME@$EC2_HOST"
          $SSH 'curl --connect-timeout 2 --max-time 10 -fsS http://127.0.0.1:8080/api/platform/status | grep -q "ForgePilot AI"'
          echo "## ForgePilot EC2 deployment green" >> "$GITHUB_STEP_SUMMARY"
          echo "Immutable release ${{ steps.release.outputs.sha }} passed health and platform-contract checks." >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup SSH key
        if: always()
        run: rm -f "$RUNNER_TEMP/ec2_key"
