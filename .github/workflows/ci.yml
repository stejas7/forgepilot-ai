name: ForgePilot Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: forgepilot-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test and package backend
        run: mvn -B clean verify

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build Docker image
        run: docker build -t forgepilot-ai:${{ github.sha }} .

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish immutable image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag forgepilot-ai:${{ github.sha }} ghcr.io/${{ github.repository }}:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}:${{ github.sha }}

  deploy:
    name: Deploy production
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Check deployment configuration
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GITHUB_OAUTH_CLIENT_ID: ${{ secrets.AI_GITHUB_OAUTH_CLIENT_ID }}
          GITHUB_OAUTH_CLIENT_SECRET: ${{ secrets.AI_GITHUB_OAUTH_CLIENT_SECRET }}
        run: |
          set -Eeuo pipefail
          test -n "$EC2_HOST"
          test -n "$EC2_USERNAME"
          test -n "$EC2_SSH_KEY"
          test -n "$GOOGLE_CLIENT_ID"
          test -n "$GOOGLE_CLIENT_SECRET"
          test -n "$GITHUB_OAUTH_CLIENT_ID"
          test -n "$GITHUB_OAUTH_CLIENT_SECRET"

      - name: Prepare SSH key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          printf '%s\n' "$EC2_SSH_KEY" > "$RUNNER_TEMP/forgepilot_key"
          chmod 600 "$RUNNER_TEMP/forgepilot_key"

      - name: Deploy immutable image
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GITHUB_OAUTH_CLIENT_ID: ${{ secrets.AI_GITHUB_OAUTH_CLIENT_ID }}
          GITHUB_OAUTH_CLIENT_SECRET: ${{ secrets.AI_GITHUB_OAUTH_CLIENT_SECRET }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
          TESTED_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          SSH="ssh -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=no -i $RUNNER_TEMP/forgepilot_key"
          timeout 60 $SSH "$EC2_USERNAME@$EC2_HOST" 'echo SSH_OK'
          printf '%s' "$GHCR_TOKEN" | $SSH "$EC2_USERNAME@$EC2_HOST" "sudo docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
          {
            printf 'FORGEPILOT_IMAGE=%s\nFORGEPILOT_PORT=8090\nOPENAI_API_KEY=%s\nFORGEPILOT_AI_MODEL=gpt-5.6-luna\nSPRING_PROFILES_ACTIVE=prod\nFORGEPILOT_PUBLIC_URL=https://forgepilot-ai.duckdns.org\nFORGEPILOT_AUTH_SSO_REQUIRED=true\nFORGEPILOT_AUTH_OAUTH_ENABLED=true\n' "$IMAGE" "$OPENAI_API_KEY"
            printf 'GOOGLE_CLIENT_ID=%s\nGOOGLE_CLIENT_SECRET=%s\n' "$GOOGLE_CLIENT_ID" "$GOOGLE_CLIENT_SECRET"
            printf 'GITHUB_OAUTH_CLIENT_ID=%s\nGITHUB_OAUTH_CLIENT_SECRET=%s\n' "$GITHUB_OAUTH_CLIENT_ID" "$GITHUB_OAUTH_CLIENT_SECRET"
          } > "$RUNNER_TEMP/forgepilot.env"
          scp -o BatchMode=yes -o StrictHostKeyChecking=no -i "$RUNNER_TEMP/forgepilot_key" "$RUNNER_TEMP/forgepilot.env" "$EC2_USERNAME@$EC2_HOST:/tmp/forgepilot.env"
          $SSH "$EC2_USERNAME@$EC2_HOST" "bash -se" <<REMOTE
          set -Eeuo pipefail
          cd "\$HOME"
          if [ ! -d forgepilot-ai/.git ]; then git clone https://github.com/${{ github.repository }}.git forgepilot-ai; fi
          cd forgepilot-ai
          git fetch --prune origin main
          git reset --hard "$TESTED_SHA"
          mv /tmp/forgepilot.env .env
          chmod 600 .env
          sudo docker compose down --remove-orphans || true
          sudo docker pull "$IMAGE"
          sudo docker compose --env-file .env up -d --force-recreate --remove-orphans
          REMOTE

      - name: Verify application inside EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
        run: |
          set -Eeuo pipefail
          SSH="ssh -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=no -i $RUNNER_TEMP/forgepilot_key"
          for i in $(seq 1 40); do
            if $SSH "$EC2_USERNAME@$EC2_HOST" "curl --connect-timeout 2 --max-time 5 -fsS http://127.0.0.1:8090/actuator/health" | grep -q '"status":"UP"'; then
              exit 0
            fi
            sleep 3
          done
          $SSH "$EC2_USERNAME@$EC2_HOST" "cd ~/forgepilot-ai && sudo docker compose logs --tail=250 forgepilot" || true
          exit 1

      - name: Verify public application
        run: |
          set -Eeuo pipefail
          for i in $(seq 1 12); do
            if curl --connect-timeout 3 --max-time 8 -fsS https://forgepilot-ai.duckdns.org/actuator/health | grep -q '"status":"UP"'; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Verify auth providers
        run: |
          set -Eeuo pipefail
          providers="$(curl --connect-timeout 3 --max-time 8 -fsS https://forgepilot-ai.duckdns.org/api/auth/providers)"
          printf '%s' "$providers" | grep -q '"id":"google"'
          printf '%s' "$providers" | grep -q '"id":"github"'

      - name: Remove temporary credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/forgepilot_key" "$RUNNER_TEMP/forgepilot.env"
