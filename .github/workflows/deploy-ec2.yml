name: Deploy ForgePilot to AWS EC2

on:
  workflow_run:
    workflows: ["ForgePilot CI"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: forgepilot-production-deploy
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check deployment configuration
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$EC2_HOST"
          test -n "$EC2_USERNAME"
          test -n "$EC2_SSH_KEY"

      - name: Resolve tested commit
        id: commit
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare SSH key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          printf '%s\n' "$EC2_SSH_KEY" > "$RUNNER_TEMP/forgepilot_key"
          chmod 600 "$RUNNER_TEMP/forgepilot_key"

      - name: Deploy immutable image
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/${{ github.repository }}:${{ steps.commit.outputs.sha }}
        run: |
          set -Eeuo pipefail
          SSH="ssh -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=no -i $RUNNER_TEMP/forgepilot_key"
          timeout 60 $SSH "$EC2_USERNAME@$EC2_HOST" 'echo SSH_OK'
          printf '%s' "$GHCR_TOKEN" | $SSH "$EC2_USERNAME@$EC2_HOST" "sudo docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
          $SSH "$EC2_USERNAME@$EC2_HOST" "bash -se" <<REMOTE
          set -Eeuo pipefail
          if command -v ufw >/dev/null 2>&1; then
            sudo ufw allow 8090/tcp || true
          fi
          if [ ! -d "\$HOME/forgepilot-ai/.git" ]; then
            git clone https://github.com/${{ github.repository }}.git "\$HOME/forgepilot-ai"
          fi
          cd "\$HOME/forgepilot-ai"
          git fetch --prune origin main
          git reset --hard origin/main
          cat > .env <<'ENVFILE'
          FORGEPILOT_IMAGE=$IMAGE
          FORGEPILOT_PORT=8090
          OPENAI_API_KEY=$OPENAI_API_KEY
          FORGEPILOT_AI_MODEL=gpt-5.6-luna
          SPRING_PROFILES_ACTIVE=prod
          ENVFILE
          chmod 600 .env
          sudo docker compose down --remove-orphans || true
          sudo docker pull "$IMAGE"
          sudo docker compose --env-file .env up -d --force-recreate --remove-orphans
          sudo docker compose ps
          sudo ss -ltnp | grep ':8090' || true
          REMOTE

      - name: Verify application inside EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
        run: |
          set -Eeuo pipefail
          SSH="ssh -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=no -i $RUNNER_TEMP/forgepilot_key"
          for i in $(seq 1 40); do
            if $SSH "$EC2_USERNAME@$EC2_HOST" "curl --connect-timeout 2 --max-time 5 -fsS http://127.0.0.1:8090/actuator/health" | grep -q '"status":"UP"'; then
              echo "ForgePilot internal health is UP"
              $SSH "$EC2_USERNAME@$EC2_HOST" "curl --connect-timeout 2 --max-time 5 -fsS http://127.0.0.1:8090/api/ai/runtime"
              exit 0
            fi
            sleep 3
          done
          $SSH "$EC2_USERNAME@$EC2_HOST" "cd ~/forgepilot-ai && sudo docker compose ps && sudo docker compose logs --tail=250 forgepilot" || true
          exit 1

      - name: Verify public endpoint
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -Eeuo pipefail
          for i in $(seq 1 12); do
            if curl --connect-timeout 3 --max-time 6 -fsS "http://$EC2_HOST:8090/actuator/health" | grep -q '"status":"UP"'; then
              echo "ForgePilot public endpoint is reachable at http://$EC2_HOST:8090/"
              exit 0
            fi
            sleep 5
          done
          echo "Public endpoint is not reachable even though internal health passed. Check AWS Security Group inbound TCP 8090."
          exit 1

      - name: Remove temporary SSH key
        if: always()
        run: rm -f "$RUNNER_TEMP/forgepilot_key"
