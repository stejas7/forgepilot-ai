services:
  forgepilot:
    image: ${FORGEPILOT_IMAGE:-ghcr.io/stejas7/forgepilot-ai:latest}
    container_name: forgepilot-ai
    restart: unless-stopped
    ports:
      - "${FORGEPILOT_PORT:-8090}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      FORGEPILOT_AI_MODEL: ${FORGEPILOT_AI_MODEL:-gpt-5.6-luna}
      FORGEPILOT_DATA_DIR: /var/lib/forgepilot
    volumes:
      - forgepilot-data:/var/lib/forgepilot

volumes:
  forgepilot-data:
