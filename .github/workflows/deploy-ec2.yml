name: Deploy ForgePilot to AWS EC2

on:
  workflow_run:
    workflows: ["ForgePilot CI"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: forgepilot-production-deploy
  cancel-in-progress: false
permissions:
  contents: read
  packages: read
jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check deployment configuration
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$EC2_HOST"; test -n "$EC2_USERNAME"; test -n "$EC2_SSH_KEY"
      - name: Resolve tested commit
        id: commit
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"; else echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"; fi
      - name: Prepare SSH key
        env: { EC2_SSH_KEY: "${{ secrets.EC2_SSH_KEY }}" }
        run: |
          printf '%s\n' "$EC2_SSH_KEY" > "$RUNNER_TEMP/forgepilot_key"; chmod 600 "$RUNNER_TEMP/forgepilot_key"
      - name: Deploy immutable image
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GITHUB_OAUTH_CLIENT_ID: ${{ secrets.GITHUB_OAUTH_CLIENT_ID }}
          GITHUB_OAUTH_CLIENT_SECRET: ${{ secrets.GITHUB_OAUTH_CLIENT_SECRET }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/${{ github.repository }}:${{ steps.commit.outputs.sha }}
          TESTED_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -Eeuo pipefail
          SSH="ssh -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=no -i $RUNNER_TEMP/forgepilot_key"
          timeout 60 $SSH "$EC2_USERNAME@$EC2_HOST" 'echo SSH_OK'
          printf '%s' "$GHCR_TOKEN" | $SSH "$EC2_USERNAME@$EC2_HOST" "sudo docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
          {
            printf 'FORGEPILOT_IMAGE=%s\nFORGEPILOT_PORT=8090\nOPENAI_API_KEY=%s\nFORGEPILOT_AI_MODEL=gpt-5.6-luna\nSPRING_PROFILES_ACTIVE=prod\nFORGEPILOT_PUBLIC_URL=https://forgepilot-ai.duckdns.org\nFORGEPILOT_AUTH_SSO_REQUIRED=true\n' "$IMAGE" "$OPENAI_API_KEY"
            if [ -n "$GOOGLE_CLIENT_ID" ] && [ -n "$GOOGLE_CLIENT_SECRET" ]; then printf 'GOOGLE_CLIENT_ID=%s\nGOOGLE_CLIENT_SECRET=%s\n' "$GOOGLE_CLIENT_ID" "$GOOGLE_CLIENT_SECRET"; fi
            if [ -n "$GITHUB_OAUTH_CLIENT_ID" ] && [ -n "$GITHUB_OAUTH_CLIENT_SECRET" ]; then printf 'GITHUB_OAUTH_CLIENT_ID=%s\nGITHUB_OAUTH_CLIENT_SECRET=%s\n' "$GITHUB_OAUTH_CLIENT_ID" "$GITHUB_OAUTH_CLIENT_SECRET"; fi
          } > "$RUNNER_TEMP/forgepilot.env"
          if grep -qE '^(GOOGLE_CLIENT_ID|GITHUB_OAUTH_CLIENT_ID)=' "$RUNNER_TEMP/forgepilot.env"; then echo 'FORGEPILOT_AUTH_OAUTH_ENABLED=true' >> "$RUNNER_TEMP/forgepilot.env"; else echo 'FORGEPILOT_AUTH_OAUTH_ENABLED=false' >> "$RUNNER_TEMP/forgepilot.env"; fi
          scp -o BatchMode=yes -o StrictHostKeyChecking=no -i "$RUNNER_TEMP/forgepilot_key" "$RUNNER_TEMP/forgepilot.env" "$EC2_USERNAME@$EC2_HOST:/tmp/forgepilot.env"
          $SSH "$EC2_USERNAME@$EC2_HOST" "bash -se" <<REMOTE
          set -Eeuo pipefail
          cd "\$HOME"
          if [ ! -d forgepilot-ai/.git ]; then git clone https://github.com/${{ github.repository }}.git forgepilot-ai; fi
          cd forgepilot-ai; git fetch --prune origin main; git reset --hard "$TESTED_SHA"
          mv /tmp/forgepilot.env .env; chmod 600 .env
          sudo docker compose down --remove-orphans || true; sudo docker pull "$IMAGE"; sudo docker compose --env-file .env up -d --force-recreate --remove-orphans
          REMOTE
      - name: Verify application inside EC2
        env: { EC2_HOST: "${{ secrets.EC2_HOST }}", EC2_USERNAME: "${{ secrets.EC2_USERNAME }}" }
        run: |
          set -Eeuo pipefail
          SSH="ssh -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=no -i $RUNNER_TEMP/forgepilot_key"
          for i in $(seq 1 40); do if $SSH "$EC2_USERNAME@$EC2_HOST" "curl --connect-timeout 2 --max-time 5 -fsS http://127.0.0.1:8090/actuator/health" | grep -q '"status":"UP"'; then exit 0; fi; sleep 3; done
          $SSH "$EC2_USERNAME@$EC2_HOST" "cd ~/forgepilot-ai && sudo docker compose logs --tail=250 forgepilot" || true; exit 1
      - name: Verify public endpoint
        env: { EC2_HOST: "${{ secrets.EC2_HOST }}" }
        run: |
          for i in $(seq 1 12); do if curl --connect-timeout 3 --max-time 6 -fsS "http://$EC2_HOST:8090/actuator/health" | grep -q '"status":"UP"'; then exit 0; fi; sleep 5; done; exit 1
      - name: Remove temporary credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/forgepilot_key" "$RUNNER_TEMP/forgepilot.env"
